[package]
name = "nya_cloud"
version = "0.2.1"
edition = "2024"
authors = ["Christopher Smith <input@cybrsmth.com>"]
license = "Apache-2.0"
description = "Self-hosted PaaS for deploying apps to your own servers"
repository = "https://github.com/NyaOps/nya"
keywords = ["paas", "kubernetes", "self-hosted", "deployment", "homelab"]
categories = ["command-line-utilities", "development-tools", "dev-ops", "cloud", "platform"]

[[bin]]
name = "nya"
path = "src/main.rs"

[dependencies]
nya_core = { path = "../nya_core" }
anyhow = "1.0.100"
base64 = "0.23.1"
chrono = { version = "0.4.43", features = ["serde"] }
dirs = "6.0.0"
clap = { version = "4.5.57", features = ["derive"] }
colored = "3.1.1"
futures = "0.3.31"
include_dir = "0.7.4"
inquire = "0.9.2"
openssh = "0.11.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["preserve_order"] }
shellexpand = "3.1.1"
tera = "2.2.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util"] }