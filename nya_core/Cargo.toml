[package]
name = "nya_core"
version = "0.1.0"
edition = "2024"
authors = ["Christopher Smith <input@cybrsmth.com>"]
license = "Apache-2.0"
description = "An asynchronous orchestration framework that makes jobs and long running executions simpler and standardized."
repository = "https://github.com/NyaOps/nya"
keywords = ["async", "orchestrator", "nya", "jobs", "runner"]
categories = ["dev-ops", "systems", "automation"]

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.88"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["preserve_order"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util"] }